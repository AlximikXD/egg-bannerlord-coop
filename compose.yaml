services:
  coop:
    image: ghcr.io/geofmigliacci/bannerlord-coop:latest
    build: .  # `up --build` uses your working tree instead of the published image
    environment:
      # The panel sends this, compose has to.
      STARTUP: /usr/local/bin/start.sh
      STEAM_USERNAME: ${STEAM_USERNAME:-}
      STEAM_PASSWORD: ${STEAM_PASSWORD:-}
      AUTO_UPDATE: ${AUTO_UPDATE:-1}  # 0 = never contact Steam, use what is there
      WORKSHOP_MODS: ${WORKSHOP_MODS:-}  # extra workshop item ids, "X,Y,Z"
      SAVE_NAME: ${SAVE_NAME:-saveauto1}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      AUTOSAVE_MINUTES: ${AUTOSAVE_MINUTES:-5}
      PLAYER_COUNT_HOST: ${PLAYER_COUNT_HOST:-0.0.0.0}
      PLAYER_COUNT_PORT: ${PLAYER_COUNT_PORT:-4202}
      PLAYER_COUNT_TOKEN: ${PLAYER_COUNT_TOKEN:-}
    # Pelican's layout, plus a bind so saves stay editable from the host.
    volumes:
      - container:/home/container
      - ./server-data:/home/container/data
    # Clients join on the first, the mod uses the second. Change only the host side (left).
    ports:
      - "4200:4200/udp"
      - "4201:4201/udp"
      - "${PLAYER_COUNT_PORT:-4202}:${PLAYER_COUNT_PORT:-4202}/tcp"
    stdin_open: true  # required: `stop`, `save` and `kick` are read from stdin
    tty: true         # required: `stty inlcr` in start.sh needs one
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  container:

name: image

on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'start.sh', 'player_count_api.py', 'tests/**', '.github/workflows/image.yml']
  pull_request:
    paths: ['Dockerfile', 'start.sh', 'player_count_api.py', 'tests/**', '.github/workflows/image.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Preinstalled on the runner image, so no action dependency.
      - run: shellcheck start.sh
      - run: sh start.sh --self-test
      - run: python3 -m unittest discover -s tests -v

      # GHCR rejects uppercase in the image path; GitHub usernames allow it.
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # The gha cache backend needs the buildx driver; the default docker one cannot export.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs build but never push. The sha tag is the rollback target, since nothing is pinned.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64  # the Dockerfile is amd64 only, don't leave it to the runner
          push: ${{ github.event_name != 'pull_request' }}
          # No attestation: it makes :latest an index whose real manifest is an untagged version.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/bannerlord-coop:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/bannerlord-coop:${{ github.sha }}
